<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Tablet — nossa história</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600&family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#14532D}a:hover{color:#0F3D22}
button{font-family:inherit;cursor:pointer}
@keyframes balanca{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
@keyframes balancaLento{0%,100%{transform:rotate(3deg) translateY(0)}50%{transform:rotate(-4deg) translateY(6px)}}
@keyframes sobe{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-760px);opacity:0}}
@keyframes kbA{0%{transform:scale(1) translate(0,0)}100%{transform:scale(1.12) translate(-2%,-2%)}}
@keyframes kbB{0%{transform:scale(1) translate(0,0)}100%{transform:scale(1.12) translate(-2%,-2%)}}
@keyframes textoA{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:translateY(0)}}
@keyframes textoB{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:translateY(0)}}
@keyframes anoA{0%{opacity:0;transform:translateX(-30px) scale(.9)}100%{opacity:1;transform:translateX(0) scale(1)}}
@keyframes anoB{0%{opacity:0;transform:translateX(-30px) scale(.9)}100%{opacity:1;transform:translateX(0) scale(1)}}
@keyframes encheA{0%{width:0}100%{width:100%}}
@keyframes encheB{0%{width:0}100%{width:100%}}
.folha-a{transform-origin:0% 0%;animation:balanca 6s ease-in-out infinite}
.folha-b{transform-origin:100% 100%;animation:balancaLento 8s ease-in-out infinite}
.folha-c{transform-origin:100% 0%;animation:balanca 7s ease-in-out infinite reverse}
.folha-d{transform-origin:0% 100%;animation:balancaLento 9s ease-in-out infinite}
.particula{position:absolute;bottom:-20px;border-radius:50%;animation:sobe linear infinite}
.kb-0{animation:kbA 9s ease-out forwards}.kb-1{animation:kbB 9s ease-out forwards}
.entra-0{animation:textoA .8s cubic-bezier(.2,.8,.2,1) both}.entra-1{animation:textoB .8s cubic-bezier(.2,.8,.2,1) both}
.entra-0 .atraso{animation:textoA .8s .25s cubic-bezier(.2,.8,.2,1) both}.entra-1 .atraso{animation:textoB .8s .25s cubic-bezier(.2,.8,.2,1) both}
.ano-0{animation:anoA .7s cubic-bezier(.2,.8,.2,1) both}.ano-1{animation:anoB .7s cubic-bezier(.2,.8,.2,1) both}
.barra-0{animation:encheA 6s linear forwards}.barra-1{animation:encheB 6s linear forwards}
@media (prefers-reduced-motion: reduce){.folha-a,.folha-b,.folha-c,.folha-d,.particula,.kb-0,.kb-1,.entra-0,.entra-1,.entra-0 .atraso,.entra-1 .atraso,.ano-0,.ano-1{animation:none}}
button,a{transition:transform .12s ease, box-shadow .12s ease}
button:active{transform:translateY(1px) scale(.99)}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; position: relative; overflow: hidden; background: {{tema.fundo}}; color: {{tema.texto}}; font-family: Inter, system-ui, sans-serif">

  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
    <sc-for list="{{particulas}}" as="p" hint-placeholder-count="14">
      <span class="particula" style="left: {{p.x}}; width: {{p.t}}; height: {{p.t}}; background: {{tema.particula}}; animation-duration: {{p.d}}; animation-delay: {{p.a}}"></span>
    </sc-for>
    <svg class="folha-a" style="position: absolute; left: -60px; top: -70px; width: 360px; height: 360px" viewBox="0 0 200 200"><g fill="{{tema.folha1}}"><path d="M10 10 C80 20 150 60 180 150 C120 140 60 100 10 10Z"></path></g><path d="M10 10 C80 60 130 100 180 150" stroke="{{tema.nervura}}" stroke-width="2" fill="none"></path><g fill="{{tema.folha2}}"><path d="M0 40 C40 80 70 140 70 200 C30 160 5 100 0 40Z"></path></g></svg>
    <svg class="folha-c" style="position: absolute; right: -40px; top: -60px; width: 300px; height: 300px" viewBox="0 0 200 200"><g fill="{{tema.folha2}}"><path d="M190 10 C120 30 60 80 30 170 C100 150 160 100 190 10Z"></path></g><path d="M190 10 C140 70 80 120 30 170" stroke="{{tema.nervura}}" stroke-width="2" fill="none"></path></svg>
    <svg class="folha-b" style="position: absolute; right: -70px; bottom: -80px; width: 420px; height: 420px" viewBox="0 0 200 200"><g fill="{{tema.folha1}}"><path d="M195 195 C120 185 50 140 20 40 C90 60 160 110 195 195Z"></path></g><path d="M195 195 C140 150 70 100 20 40" stroke="{{tema.nervura}}" stroke-width="2" fill="none"></path><g fill="{{tema.folha3}}"><path d="M200 120 C150 110 110 80 90 20 C140 40 180 70 200 120Z"></path></g></svg>
    <svg class="folha-d" style="position: absolute; left: -50px; bottom: -60px; width: 260px; height: 260px" viewBox="0 0 200 200"><g fill="{{tema.folha3}}"><path d="M5 195 C40 120 100 60 190 30 C170 110 110 170 5 195Z"></path></g><path d="M5 195 C70 140 130 80 190 30" stroke="{{tema.nervura}}" stroke-width="2" fill="none"></path></svg>
  </div>

  <sc-if value="{{modoNormal}}" hint-placeholder-val="{{true}}">
    <div style="position: relative; height: 100%; display: flex; flex-direction: column; padding: 24px 40px 28px; box-sizing: border-box; gap: 20px">
      <header style="display: flex; align-items: center; gap: 14px">
        <a href="Main.dc.html" aria-label="Voltar ao cardápio" style="width: 48px; height: 48px; box-sizing: border-box; border-radius: 24px; background: {{tema.botao}}; border: 1px solid {{tema.borda}}; color: {{tema.texto}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(16,24,20,.06), 0 3px 10px rgba(16,24,20,.07), inset 0 -1px 0 rgba(16,24,20,.04)">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
        </a>
        <span style="font-family: Fraunces, Georgia, serif; font-style: italic; font-size: 26px; flex-grow: 1">Nossa história</span>
        <button type="button" onClick="{{alternarApresentacao}}" style="height: 48px; padding: 0 20px; border-radius: 24px; border: 0; background: {{accent}}; color: #FFFFFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; box-shadow: 0 1px 2px rgba(12,51,28,.28), 0 6px 14px rgba(20,83,45,.22), inset 0 1px 0 rgba(255,255,255,.14); background-image: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,0))">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"></path></svg>Modo apresentação
        </button>
      </header>

      <div style="flex-grow: 1; min-height: 0; display: flex; gap: 40px; align-items: center">
        <div style="position: relative; width: 640px; height: 470px; flex-shrink: 0; border-radius: 28px; overflow: hidden; box-shadow: 0 30px 60px rgba(20,60,30,.25)">
          <div class="kb-{{fase}}" style="position: absolute; inset: -4%; background: {{cap.tom}}; display: flex; align-items: center; justify-content: center; color: #DADADA; font-size: 14px">[FOTO DESTE ANO]</div>
          <span class="ano-{{fase}}" style="position: absolute; left: 24px; bottom: 20px; font-family: Outfit, sans-serif; font-size: 76px; font-weight: 800; line-height: 1; color: #FFFFFF; text-shadow: 0 4px 18px rgba(0,0,0,.45)">{{cap.ano}}</span>
          <button type="button" aria-label="Capítulo anterior" onClick="{{anterior}}" style="position: absolute; left: 16px; top: 50%; margin-top: -28px; width: 56px; height: 56px; border-radius: 28px; border: 0; background: rgba(255,255,255,.92); color: #1A1A1A; display: flex; align-items: center; justify-content: center">
            <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
          </button>
          <button type="button" aria-label="Próximo capítulo" onClick="{{proximo}}" style="position: absolute; right: 16px; top: 50%; margin-top: -28px; width: 56px; height: 56px; border-radius: 28px; border: 0; background: rgba(255,255,255,.92); color: #1A1A1A; display: flex; align-items: center; justify-content: center">
            <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
          </button>
        </div>
        <article class="entra-{{fase}}" style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px">
          <span style="font-size: 14px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: {{tema.destaque}}">Capítulo {{cap.n}} · {{cap.rotulo}}</span>
          <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-style: italic; font-weight: 500; font-size: 44px; line-height: 1.1">{{cap.titulo}}</h1>
          <p class="atraso" style="margin: 0; font-size: 18px; line-height: 1.65; color: {{tema.textoSec}}">{{cap.texto}}</p>
        </article>
      </div>

      <nav aria-label="Linha do tempo" style="position: relative; padding-top: 6px">
        <div aria-hidden="true" style="position: absolute; left: 30px; right: 30px; top: 27px; height: 3px; border-radius: 2px; background: {{tema.linha}}"></div>
        <div style="position: relative; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr))">
          <sc-for list="{{linha}}" as="l" hint-placeholder-count="6">
            <button type="button" onClick="{{l.ir}}" aria-current="{{l.atual}}" style="border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0; color: {{tema.texto}}">
              <span style="width: {{l.tam}}; height: {{l.tam}}; margin-top: {{l.margem}}; border-radius: 50%; background: {{l.fundo}}; border: 3px solid {{l.borda}}; box-sizing: border-box"></span>
              <span style="font-family: Outfit, sans-serif; font-size: 16px; font-weight: {{l.peso}}">{{l.ano}}</span>
              <span style="font-size: 12px; color: {{tema.textoSec}}">{{l.rotulo}}</span>
            </button>
          </sc-for>
        </div>
      </nav>
    </div>
  </sc-if>

  <sc-if value="{{modoApresentacao}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; background: #2E2E2E">
      <div class="kb-{{fase}}" style="position: absolute; inset: -6%; background: {{cap.tom}}; display: flex; align-items: center; justify-content: center; color: #DADADA; font-size: 16px">[FOTO OU VÍDEO EM TELA CHEIA]</div>
      <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 60%; background: rgba(40,40,40,.72)"></div>
      <div style="position: absolute; left: 70px; right: 70px; bottom: 90px; display: flex; flex-direction: column; gap: 14px; color: #FFFFFF">
        <span class="ano-{{fase}}" style="font-family: Outfit, sans-serif; font-size: 110px; font-weight: 800; line-height: .9">{{cap.ano}}</span>
        <div class="entra-{{fase}}" style="display: flex; flex-direction: column; gap: 12px; max-width: 820px">
          <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-style: italic; font-weight: 500; font-size: 46px; line-height: 1.1; color: #FFFFFF">{{cap.titulo}}</h1>
          <p class="atraso" style="margin: 0; font-size: 20px; line-height: 1.6; color: #E4F0E7">{{cap.texto}}</p>
        </div>
      </div>
      <div style="position: absolute; left: 70px; right: 70px; bottom: 40px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px" aria-hidden="true">
        <sc-for list="{{barras}}" as="b" hint-placeholder-count="6">
          <span style="height: 4px; border-radius: 2px; background: rgba(255,255,255,.3); overflow: hidden; display: block">
            <span class="{{b.classe}}" style="display: block; height: 4px; width: {{b.largura}}; background: #FFFFFF"></span>
          </span>
        </sc-for>
      </div>
      <button type="button" onClick="{{alternarApresentacao}}" style="position: absolute; right: 24px; top: 24px; height: 48px; padding: 0 18px; border-radius: 24px; border: 0; background: rgba(255,255,255,.92); color: #1A1A1A; font-size: 15px; font-weight: 700">Sair da apresentação</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#14532D","options":["#14532D","#0F3D2E","#1E6B45","#1F5FBF"]},"tema":{"editor":"enum","options":["Floresta clara","Floresta noturna","Rio e areia"],"default":"Floresta clara"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => {
      const st = this.state || {};
      if (st.apresentar) this.setState({ i: ((st.i || 0) + 1) % 6, fase: st.fase ? 0 : 1 });
    }, 6000);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const accent = this.props.accent ?? '#14532D';
    const temas = {
      'Floresta clara':   { fundo: '#F3F7F1', texto: '#13261A', textoSec: '#3E5446', destaque: accent, folha1: '#2F7A4A', folha2: '#4E9A62', folha3: '#1E5C36', nervura: 'rgba(255,255,255,.35)', particula: 'rgba(78,154,98,.45)', botao: '#FFFFFF', borda: '#D5E4D8', linha: '#C9DDCD' },
      'Floresta noturna': { fundo: '#0E1F15', texto: '#FFFFFF', textoSec: '#C9DCCD', destaque: '#9FE0B4', folha1: '#1E5C36', folha2: '#2F7A4A', folha3: '#14432A', nervura: 'rgba(255,255,255,.18)', particula: 'rgba(240,230,140,.7)', botao: 'rgba(255,255,255,.08)', borda: 'rgba(255,255,255,.18)', linha: 'rgba(255,255,255,.2)' },
      'Rio e areia':      { fundo: '#F4F4F4', texto: '#1F2A24', textoSec: '#4A5550', destaque: '#1F5F7A', folha1: '#3C7D57', folha2: '#6FA37F', folha3: '#2B6345', nervura: 'rgba(255,255,255,.35)', particula: 'rgba(31,95,122,.35)', botao: '#FFFFFF', borda: '#DEDEDE', linha: '#DCDCDC' }
    };
    const tema = temas[this.props.tema ?? 'Floresta clara'] || temas['Floresta clara'];
    const caps = [
      { ano: '[ANO 1]', rotulo: 'O começo', titulo: '[Como tudo começou]', texto: '[Conte em 2 ou 3 frases como o restaurante nasceu: quem fundou, onde e qual era o sonho.]', tom: '#4D4D4D' },
      { ano: '[ANO 2]', rotulo: 'Primeira casa', titulo: '[Título do capítulo]', texto: '[O que aconteceu neste ano.]', tom: '#404040' },
      { ano: '[ANO 3]', rotulo: 'O prato da casa', titulo: '[Título do capítulo]', texto: '[O que aconteceu neste ano.]', tom: '#484848' },
      { ano: '[ANO 4]', rotulo: 'Crescimento', titulo: '[Título do capítulo]', texto: '[O que aconteceu neste ano.]', tom: '#3D3D3D' },
      { ano: '[ANO 5]', rotulo: 'Novos sabores', titulo: '[Título do capítulo]', texto: '[O que aconteceu neste ano.]', tom: '#555555' },
      { ano: '[HOJE]', rotulo: 'Hoje', titulo: '[Onde estamos hoje]', texto: '[E o que vem por aí.]', tom: '#3A3A3A' }
    ];
    const st = this.state || {};
    const i = st.i || 0;
    const fase = st.fase || 0;
    const ir = (n) => this.setState({ i: (n + caps.length) % caps.length, fase: fase ? 0 : 1 });
    const parts = Array.from({ length: 14 }, (_, k) => ({
      x: ((k * 73) % 100) + '%', t: (4 + (k % 4) * 2) + 'px', d: (10 + (k % 5) * 3) + 's', a: (-(k * 1.7)) + 's'
    }));
    return {
      accent, tema, fase,
      particulas: parts,
      modoNormal: !st.apresentar,
      modoApresentacao: !!st.apresentar,
      alternarApresentacao: () => this.setState({ apresentar: !st.apresentar, fase: fase ? 0 : 1 }),
      cap: { ...caps[i], n: i + 1 },
      anterior: () => ir(i - 1),
      proximo: () => ir(i + 1),
      linha: caps.map((c, k) => ({
        ano: c.ano, rotulo: c.rotulo, atual: k === i ? 'step' : 'false', ir: () => ir(k),
        tam: k === i ? '28px' : '18px', margem: k === i ? '0px' : '5px',
        fundo: k <= i ? accent : tema.fundo, borda: k <= i ? accent : tema.linha, peso: k === i ? 800 : 600
      })),
      barras: caps.map((c, k) => ({ largura: k < i ? '100%' : (k === i ? '0%' : '0%'), classe: k === i ? `barra-${fase}` : '' }))
    };
  }
}
</script>
</body>
</html>
